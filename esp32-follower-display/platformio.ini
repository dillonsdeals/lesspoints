; PlatformIO project for the ESP32-2432S028R "Cheap Yellow Display".
; Build + flash:  pio run -t upload   |   serial log:  pio device monitor
[platformio]
src_dir = follower_display
default_envs = cyd

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv      ; TLS + fonts need more than the default 1.2 MB app slot
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  bblanchon/ArduinoJson@^7.3.0
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

; TFT_eSPI configuration for this board (replaces the library's User_Setup.h)
build_flags =
  -DUSER_SETUP_LOADED=1
  -DILI9341_2_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_GFXFF=1
  -DSPI_FREQUENCY=55000000
  -DSPI_READ_FREQUENCY=20000000
  -DSPI_TOUCH_FREQUENCY=2500000
  ; uncomment if colours look inverted (some board revisions need it)
  ; -DTFT_INVERSION_ON=1
